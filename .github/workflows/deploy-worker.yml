name: Deploy Cloudflare Worker

# Runs automatically whenever worker.js or wrangler.toml changes on main -- this is
# what removes the manual "paste into Cloudflare's Edit Code UI" step. It does NOT
# touch index.html/shows.json/admin.html; those are served directly from the repo
# via GitHub Pages and need no separate deploy step.
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch: {} # lets you also trigger a manual redeploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must be Wrangler 4+. The action defaults to a 3.x release, which does not
          # understand the `secrets_store_secrets` key in wrangler.toml -- it rejects
          # the whole config and exits 1 before deploying anything.
          wranglerVersion: '4'
          # Reads wrangler.toml for KV bindings, Secrets Store bindings, cron triggers,
          # routes, and vars. Deploying WITHOUT that config (bare flags) strips those
          # from the live Worker -- that is what broke sign-in and email once already.
          command: deploy
