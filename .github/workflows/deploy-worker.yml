name: Deploy Cloudflare Worker

# Runs automatically whenever worker.js or wrangler.toml changes on main -- this is
# what removes the manual "paste into Cloudflare's Edit Code UI" step. It does NOT
# touch index.html/shows.json/admin.html; those are served directly from the repo
# via GitHub Pages and need no separate deploy step.
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch: {} # lets you also trigger a manual redeploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the exact failure mode that once got past this workflow: PRs #3/#4
      # committed esbuild-bundled output over the hand-written source, twice, so every
      # function in the file was declared two times back to back (only the second,
      # later copy of each ever ran, since JS lets a later top-level function
      # declaration silently shadow an earlier one — `wrangler deploy --dry-run` below
      # doesn't catch this, since the duplicated file was still syntactically valid).
      - name: Sanity-check worker.js (syntax + no duplicate top-level functions)
        run: |
          node --check worker.js
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('worker.js', 'utf8');
            const names = [...src.matchAll(/^(?:async function|function) ([A-Za-z_$][\w$]*)/gm)].map(m => m[1]);
            const seen = new Set();
            const dupes = new Set();
            for (const n of names) { if (seen.has(n)) dupes.add(n); seen.add(n); }
            if (dupes.size) {
              console.error('Duplicate top-level function declaration(s):', [...dupes].join(', '));
              process.exit(1);
            }
          "

      - name: Validate config (surfaces the real error if the deploy fails)
        run: npx --yes wrangler@4 deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # Calling wrangler directly rather than through wrangler-action: the action
        # swallows Wrangler's stdout/stderr and only reports "exit code 1", which made
        # two separate failures impossible to diagnose. Running it as a plain step
        # prints the actual error.
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
