name: Deploy Cloudflare Worker

# Runs automatically whenever worker.js or wrangler.toml changes on main -- this is
# what removes the manual "paste into Cloudflare's Edit Code UI" step. It does NOT
# touch index.html/shows.json/admin.html; those are served directly from the repo
# via GitHub Pages and need no separate deploy step.
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch: {} # lets you also trigger a manual redeploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config (surfaces the real error if the deploy fails)
        run: npx --yes wrangler@4 deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # Calling wrangler directly rather than through wrangler-action: the action
        # swallows Wrangler's stdout/stderr and only reports "exit code 1", which made
        # two separate failures impossible to diagnose. Running it as a plain step
        # prints the actual error.
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
