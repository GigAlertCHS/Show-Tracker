name = "show-tracker-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# The remote has workers_dev enabled; declaring it prevents a deploy from silently
# disabling the *.workers.dev fallback URL. Must be top-level, not inside [[routes]].
workers_dev = true

# CRITICAL: Wrangler treats this file as the source of truth on deploy. Anything a
# deploy needs that ISN'T declared here can be dropped from the live Worker --
# which is exactly how an automated deploy silently breaks auth, user data, and
# the weekly digest all at once. Every binding, trigger, and route the Worker
# depends on must be listed below.

# --- KV: user accounts, sessions, subscribers, venue suggestions, rate limits ---
# This binding was stripped once by a deploy that ran without this config file --
# sign-in broke immediately because every auth path reads from KV. Declaring it here
# is what prevents that from recurring.
[[kv_namespaces]]
binding = "SHOW_TRACKER_KV"
id = "d6ce7eeb579342ddaab94ae9560ddfc2"

# --- Secrets Store bindings ---
# These were ALSO stripped by the deploy that ran without this config -- the secrets
# themselves survived in the Secrets Store, but the Worker lost the bindings pointing
# at them, which silently broke magic-link email and turned off Turnstile bot
# protection (worker.js deliberately "fails open" when TURNSTILE_SECRET_KEY is absent).
# The secret VALUES are never in this file -- only references to them. Safe to commit.
# NOTE: `binding` is the name worker.js reads off `env` (uppercase, matching the code).
# `secret_name` must match the name in the Secrets Store EXACTLY. Four of these are
# lowercase AND hyphenated in the store, unlike the binding names -- that asymmetry
# is real, not a typo. (Confirmed from wrangler's own remote-vs-local config diff.)
[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "30c772729ee04e95b2d1ee57b4be87fd"
secret_name = "RESEND_API_KEY"

[[secrets_store_secrets]]
binding = "TURNSTILE_SECRET_KEY"
store_id = "30c772729ee04e95b2d1ee57b4be87fd"
secret_name = "turnstile-secret-key"

[[secrets_store_secrets]]
binding = "COWORK_API_SECRET"
store_id = "30c772729ee04e95b2d1ee57b4be87fd"
secret_name = "cowork-api-secret"

[[secrets_store_secrets]]
binding = "RESEND_WEBHOOK_SECRET"
store_id = "30c772729ee04e95b2d1ee57b4be87fd"
secret_name = "resend-webhook-secret"

[[secrets_store_secrets]]
binding = "CLOUDFLARE_ANALYTICS_TOKEN"
store_id = "30c772729ee04e95b2d1ee57b4be87fd"
secret_name = "cloudflare-analytics-token"

# --- Cron: weekly digest email ---
# This must match what's live, or a deploy silently reschedules the digest. The
# remote is "0 19 * * wed" (19:00 UTC Wednesdays) -- an earlier version of this file
# said "0 18 * * 3", which would have shifted the send an hour earlier.
[triggers]
crons = ["0 19 * * wed"]

# --- Custom domain route ---
# The site calls https://api.chs.shownotice.com; without this the Worker is only
# reachable at its *.workers.dev URL and every frontend API call breaks.
# zone_name must be an active zone in this Cloudflare account, or deploy fails.
[[routes]]
pattern = "api.chs.shownotice.com"
custom_domain = true
zone_name = "shownotice.com"

# The bare apex domain has no site of its own -- routing it to this same Worker is
# what lets the hostname check at the top of fetch() answer it at all (a Worker only
# ever sees requests for hostnames it's been given a route for) and bounce it to
# chs.shownotice.com. Cloudflare provisions the DNS record + TLS cert for a Custom
# Domain automatically on deploy.
[[routes]]
pattern = "shownotice.com"
custom_domain = true
zone_name = "shownotice.com"

# --- Observability: Workers Logs + Traces ---
# Optional (nothing depends on this to function), but without it declared here the
# same "wrangler is the source of truth" rule applies as everything else in this file:
# turning it on in the dashboard alone wouldn't survive the next deploy. Exact shape
# copied from what the Cloudflare dashboard itself gave as the wrangler.toml to add.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# --- Plain (non-secret) vars ---
# Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY, COWORK_API_SECRET) are deliberately
# NOT here -- they stay as dashboard-managed secrets / Secrets Store bindings and are
# not affected by a wrangler deploy. Never put secret values in this file; it's public.
[vars]
RESEND_FROM_ADDRESS = "Lowcountry Show Notice <shows@shownotice.com>"
SITE_URL = "https://chs.shownotice.com/"
WORKER_BASE_URL = "https://api.chs.shownotice.com"
OWNER_EMAIL = "gigalertchs@gmail.com"
# Not secret -- just an identifier for which zone to query in fetchCloudflareZoneAnalytics.
CLOUDFLARE_ZONE_ID = "dfc9d980ae14b42d5ea591a4bdc90136"
