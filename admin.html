<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show Notice — Admin</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
<style>
  :root{
    --ink:#12141c;--panel:#1b1e2a;--line:#2c3040;--text:#eee9db;--muted:#9599ad;
    --amber:#f0a83c;--teal:#4fd1b0;--red:#e2453d;
  }
  *{box-sizing:border-box;}
  body{background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:24px 16px 60px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 20px 0;}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .block h2{font-size:14px;text-transform:uppercase;letter-spacing:0.05em;color:var(--amber);margin:0 0 12px 0;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .muted{color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;}
  .signin-box{text-align:center;padding:40px 20px;}
  .signin-box input{width:100%;max-width:280px;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;margin-bottom:10px;}
  .signin-box button, .refresh-btn{padding:10px 20px;border-radius:6px;border:none;background:var(--teal);color:#0b1512;font-weight:600;font-size:14px;cursor:pointer;}
  .error{color:var(--red);font-size:13px;padding:12px;text-align:center;}
  /* table-layout:fixed + the same fixed width on every numeric column, on every
     instance of this table across every block, is what makes the Week/Month/Year/All
     columns line up vertically down the page -- every .window-table shares the same
     overall width (all inside the same max-width .wrap), so identical column widths
     land at identical horizontal positions regardless of how long each table's own
     label column content is. */
  .window-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  .window-table th, .window-table td{padding:6px 8px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .window-table th:first-child, .window-table td:first-child{text-align:left;padding-left:0;}
  .window-table th:not(:first-child), .window-table td:not(:first-child){width:72px;}
  .window-table th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .window-table th:hover{color:var(--text);}
  .window-table td{border-bottom:1px solid var(--line);}
  .window-table tr:last-child td{border-bottom:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Show Notice — Admin</h1>
  <div id="content">
    <div class="signin-box">
      <p class="muted">Sign in with the owner account to view stats.</p>
      <div><input type="email" id="admin-email" placeholder="your@email.com"></div>
      <div id="admin-turnstile" style="margin:10px auto;display:flex;justify-content:center;"></div>
      <button id="admin-signin-btn">Send sign-in link</button>
    </div>
  </div>
</div>

<script>
const WORKER_BASE_URL = 'https://show-tracker-api.gigalertchs.workers.dev';
let SESSION_TOKEN = localStorage.getItem('sessionToken') || null;
const TURNSTILE_SITE_KEY = '0x4AAAAAAEkfZ3ATboand-06';
let ADMIN_TURNSTILE_WIDGET_ID = null;

// The backend's /api/auth/request-link now requires a Turnstile token whenever a
// secret key is configured (it used to "fail open" only while that secret was
// missing) -- this page never rendered a widget, so every request-link call here
// was silently getting rejected with "Verification failed" once the secret was set.
window.onTurnstileLoad = function(){
  const container = document.getElementById('admin-turnstile');
  if(container) ADMIN_TURNSTILE_WIDGET_ID = turnstile.render(container, { sitekey: TURNSTILE_SITE_KEY });
};

function fmtDate(ms){
  if(!ms) return '—';
  return new Date(ms).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

async function beginSignIn(){
  const email = document.getElementById('admin-email').value.trim();
  if(!email){ alert('Enter an email address.'); return; }
  const turnstileToken = (window.turnstile && ADMIN_TURNSTILE_WIDGET_ID !== null)
    ? turnstile.getResponse(ADMIN_TURNSTILE_WIDGET_ID)
    : '';
  try{
    const res = await fetch(`${WORKER_BASE_URL}/api/auth/request-link`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, turnstileToken, returnTo:'admin'})
    });
    const data = await res.json();
    if(window.turnstile && ADMIN_TURNSTILE_WIDGET_ID !== null) turnstile.reset(ADMIN_TURNSTILE_WIDGET_ID);
    if(data.error){ alert(data.error); return; }
    if(data.testMode){ alert('Test mode — sign-in link:\\n\\n' + data.magicLink); }
    else { alert('Close this tab and check your email for a sign-in link.'); }
  }catch(e){
    if(window.turnstile && ADMIN_TURNSTILE_WIDGET_ID !== null) turnstile.reset(ADMIN_TURNSTILE_WIDGET_ID);
    alert('Something went wrong. Please try again.');
  }
}

// Every value below originates from other people: subscriber/account emails, artist
// names users typed into Favorite Artists, and venue-suggestion text. Interpolating
// any of it raw into innerHTML is a stored-XSS path that executes in the OWNER's
// browser -- the one session that can read every other user's email address. Escape
// everything, without exception, even fields that "should" be safe.
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Last-loaded stats and each table's current sort, keyed by table id -- clicking a
// header re-sorts just that table and re-renders from this same data rather than
// re-fetching, so sort state persists across a click but resets on the next Refresh.
let LAST_STATS_DATA = null;
const SORT_STATE = {};

function sortRows(rows, state){
  const mul = state.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const av = state.key === 'label' ? a.label : a.w[state.key];
    const bv = state.key === 'label' ? b.label : b.w[state.key];
    return typeof av === 'string' ? mul * av.localeCompare(bv) : mul * (av - bv);
  });
}

// Renders a { '': '', Week, Month, Year, All } table for any set of rows shaped
// {label, w:{week,month,year,all}} -- used for everything with a rolling-window
// breakdown (new subscribers, unsubscribes, suggestions, digest engagement) so they
// all read the same way instead of each inventing their own layout. tableId must be
// unique per table on the page -- it's both the sort-state key and how the click
// handler below knows which table's rows to re-sort.
function windowTableHtml(rows, tableId){
  const state = SORT_STATE[tableId] || { key: 'all', dir: 'desc' };
  SORT_STATE[tableId] = state;
  const sorted = sortRows(rows, state);
  const arrow = k => state.key === k ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const th = (k, label) => `<th data-table-id="${tableId}" data-sort-key="${k}">${label}${arrow(k)}</th>`;
  const header = `<tr>${th('label', '')}${th('week', 'Week')}${th('month', 'Month')}${th('year', 'Year')}${th('all', 'All')}</tr>`;
  const body = sorted.map(r => `<tr><td>${escapeHtml(r.label)}</td><td>${escapeHtml(r.w.week)}</td><td>${escapeHtml(r.w.month)}</td><td>${escapeHtml(r.w.year)}</td><td>${escapeHtml(r.w.all)}</td></tr>`).join('');
  return `<table class="window-table">${header}${body}</table>`;
}

function renderStats(data){
  const el = document.getElementById('content');
  const subsHtml = data.subscribers.list.length
    ? data.subscribers.list.map(s => `<div class="stat-row"><span>${escapeHtml(s.email)}</span><span class="muted">${escapeHtml(fmtDate(s.subscribedAt))}</span></div>`).join('')
    : '<div class="empty">No subscribers yet.</div>';

  const usersHtml = data.users.list.length
    ? data.users.list.map(u => `<div class="stat-row"><span>${escapeHtml(u.email)}</span><span class="muted">${escapeHtml(u.myShowsCount)} shows &middot; ${escapeHtml(u.favoritesCount)} favorites</span></div>`).join('')
    : '<div class="empty">No accounts yet.</div>';
  const usersWindowHtml = windowTableHtml([{ label: 'New accounts', w: data.users.window }], 'users');

  // Backfilled entries (see handleAdminStats) all share the same added-at moment (the
  // first admin-panel load after that backfill ran), so their week/month/year columns
  // will look identical to their all-time count until real new activity comes in --
  // expected, not a bug.
  const artistsHtml = data.topFavoriteArtists.length
    ? windowTableHtml(data.topFavoriteArtists.map(a => ({ label: a.artist, w: a.window })), 'artists')
    : '<div class="empty">No favorite artists tracked yet.</div>';

  const venuesHtml = data.topVenues.length
    ? windowTableHtml(data.topVenues.map(v => ({ label: v.venue, w: v.window })), 'venues')
    : '<div class="empty">No starred upcoming shows yet.</div>';

  const starredShowsHtml = data.topStarredShows.length
    ? windowTableHtml(data.topStarredShows.map(s => ({ label: `${s.band} — ${s.venue} · ${fmtDate(new Date(s.date + 'T12:00:00').getTime())}`, w: s.window })), 'shows')
    : '<div class="empty">No starred upcoming shows yet.</div>';

  const d = data.digestStats;
  const pct = (n, of) => of ? Math.round((n / of) * 100) + '%' : '—';
  const digestHtml = windowTableHtml([
    { label: 'Delivered', w: d.delivered },
    { label: 'Opened', w: d.opened },
    { label: 'Clicked', w: d.clicked }
  ], 'digest') + `<p class="muted" style="font-size:11px;margin:8px 0 0;">All-time open rate ${pct(d.opened.all, d.delivered.all)} &middot; click rate ${pct(d.clicked.all, d.delivered.all)}</p>`;

  const subsWindowHtml = windowTableHtml([
    { label: 'New subscribers', w: data.subscribers.window },
    { label: 'Unsubscribed', w: data.unsubscribed.window }
  ], 'subs');

  const suggestionsWindowHtml = windowTableHtml([{ label: 'Suggestions', w: data.suggestions.window }], 'suggestions');

  const cf = data.cloudflareStats;
  const cloudflareHtml = cf.error
    ? `<div class="error" style="text-align:left;padding:8px 0;">Couldn't load: ${escapeHtml(cf.error)}</div>`
    : windowTableHtml([
        { label: 'Requests', w: cf.requests },
        { label: 'Page views', w: cf.pageViews },
        { label: 'Threats blocked', w: cf.threats }
      ], 'cloudflare')
      + `<p class="muted" style="font-size:11px;margin:8px 0 0;">All-time cache hit rate ${cf.cacheHitRatio === null ? '—' : cf.cacheHitRatio + '%'} &middot; error rate (4xx/5xx) ${cf.errorRate === null ? '—' : cf.errorRate + '%'}</p>`
      + `<p class="muted" style="font-size:11px;margin:4px 0 0;">Unique visitors aren't shown here (can't be summed accurately across days) -- see Cloudflare's own Web Analytics dashboard for that.</p>`;

  const countriesHtml = !cf.error && cf.topCountries.length
    ? windowTableHtml(cf.topCountries.map(c => ({ label: c.country, w: c.window })), 'countries')
    : '<div class="empty">No country data yet.</div>';

  const suggestionsHtml = data.suggestions.list.length
    ? data.suggestions.list.map(s => `<div class="stat-row" style="display:block;"><div><strong>${escapeHtml(s.venueName)}</strong> <span class="muted">— ${escapeHtml(s.submitterEmail)} &middot; ${escapeHtml(fmtDate(s.submittedAt))}</span></div>${s.notes ? `<div class="muted" style="margin-top:4px;">${escapeHtml(s.notes)}</div>` : ''}</div>`).join('')
    : '<div class="empty">No suggestions yet.</div>';

  el.innerHTML = `
    <div class="block"><h2>Subscribers (${data.subscribers.count}) &middot; Unsubscribed (${data.unsubscribed.count})</h2>${subsWindowHtml}</div>
    <div class="block"><h2>Subscriber list</h2>${subsHtml}</div>
    <div class="block"><h2>Accounts (${data.users.count})</h2>${usersWindowHtml}</div>
    <div class="block"><h2>Account list</h2>${usersHtml}</div>
    <div class="block"><h2>Digest email engagement</h2>${digestHtml}</div>
    <div class="block"><h2>Site traffic (Cloudflare)</h2>${cloudflareHtml}</div>
    <div class="block"><h2>Top countries (Cloudflare)</h2>${countriesHtml}</div>
    <div class="block"><h2>Top favorited artists</h2>${artistsHtml}</div>
    <div class="block"><h2>Top favorited venues</h2>${venuesHtml}</div>
    <div class="block"><h2>Most-starred upcoming shows</h2>${starredShowsHtml}</div>
    <div class="block"><h2>Venue suggestions (${data.suggestions.count})</h2>${suggestionsWindowHtml}${suggestionsHtml}</div>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
    <p class="muted" style="font-size:11px;margin-top:16px;">Week/Month/Year columns are rolling windows (last 7/30/365 days), not calendar periods.</p>
  `;
  document.getElementById('refresh-btn').addEventListener('click', loadStats);
}

async function loadStats(){
  if(!SESSION_TOKEN){ return; }
  const el = document.getElementById('content');
  try{
    const res = await fetch(`${WORKER_BASE_URL}/api/admin/stats`, {
      headers: { 'Authorization': `Bearer ${SESSION_TOKEN}` }
    });
    const data = await res.json();
    if(data.error){
      el.innerHTML = `<div class="error">${escapeHtml(data.error)}${data.error === 'Not authorized' ? ' — this page only works for the site owner account.' : ''}</div>`;
      return;
    }
    LAST_STATS_DATA = data;
    renderStats(data);
  }catch(e){
    el.innerHTML = '<div class="error">Failed to load stats. Try refreshing.</div>';
  }
}

// Delegated so it keeps working across every renderStats() rebuild -- clicking a
// column header re-sorts just that one table (toggling direction on a repeat click of
// the same column) and re-renders from the already-loaded data, no re-fetch needed.
document.getElementById('content').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort-key]');
  if (!th || !LAST_STATS_DATA) return;
  const tableId = th.getAttribute('data-table-id');
  const key = th.getAttribute('data-sort-key');
  const current = SORT_STATE[tableId] || { key: 'all', dir: 'desc' };
  SORT_STATE[tableId] = current.key === key
    ? { key, dir: current.dir === 'asc' ? 'desc' : 'asc' }
    : { key, dir: key === 'label' ? 'asc' : 'desc' };
  renderStats(LAST_STATS_DATA);
});

(function init(){
  const params = new URLSearchParams(window.location.search);
  const incomingSession = params.get('session');
  if(incomingSession){
    SESSION_TOKEN = incomingSession;
    localStorage.setItem('sessionToken', SESSION_TOKEN);
    window.history.replaceState({}, '', window.location.pathname);
  }
  if(SESSION_TOKEN){
    loadStats();
  } else {
    document.getElementById('admin-signin-btn').addEventListener('click', beginSignIn);
  }
})();
</script>
</body>
</html>
