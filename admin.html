<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show Tracker — Admin</title>
<style>
  :root{
    --ink:#12141c;--panel:#1b1e2a;--line:#2c3040;--text:#eee9db;--muted:#9599ad;
    --amber:#f0a83c;--teal:#4fd1b0;--red:#e2453d;
  }
  *{box-sizing:border-box;}
  body{background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:24px 16px 60px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 20px 0;}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .block h2{font-size:14px;text-transform:uppercase;letter-spacing:0.05em;color:var(--amber);margin:0 0 12px 0;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .muted{color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;}
  .signin-box{text-align:center;padding:40px 20px;}
  .signin-box input{width:100%;max-width:280px;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;margin-bottom:10px;}
  .signin-box button, .refresh-btn{padding:10px 20px;border-radius:6px;border:none;background:var(--teal);color:#0b1512;font-weight:600;font-size:14px;cursor:pointer;}
  .error{color:var(--red);font-size:13px;padding:12px;text-align:center;}
  .chip{display:inline-block;background:rgba(240,168,60,0.1);border:1px solid var(--amber);border-radius:20px;padding:3px 10px;font-size:12px;margin:3px 4px 3px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Show Tracker — Admin</h1>
  <div id="content">
    <div class="signin-box">
      <p class="muted">Sign in with the owner account to view stats.</p>
      <div><input type="email" id="admin-email" placeholder="your@email.com"></div>
      <button id="admin-signin-btn">Send sign-in link</button>
    </div>
  </div>
</div>

<script>
const WORKER_BASE_URL = 'https://show-tracker-api.gigalertchs.workers.dev';
let SESSION_TOKEN = localStorage.getItem('sessionToken') || null;

function fmtDate(ms){
  if(!ms) return '—';
  return new Date(ms).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

async function beginSignIn(){
  const email = document.getElementById('admin-email').value.trim();
  if(!email){ alert('Enter an email address.'); return; }
  try{
    const res = await fetch(`${WORKER_BASE_URL}/api/auth/request-link`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})
    });
    const data = await res.json();
    if(data.error){ alert(data.error); return; }
    if(data.testMode){ alert('Test mode — sign-in link:\\n\\n' + data.magicLink); }
    else { alert('Check your email for a sign-in link.'); }
  }catch(e){ alert('Something went wrong. Please try again.'); }
}

function renderStats(data){
  const el = document.getElementById('content');
  const subsHtml = data.subscribers.list.length
    ? data.subscribers.list.map(s => `<div class="stat-row"><span>${s.email}</span><span class="muted">${fmtDate(s.subscribedAt)}</span></div>`).join('')
    : '<div class="empty">No subscribers yet.</div>';

  const usersHtml = data.users.list.length
    ? data.users.list.map(u => `<div class="stat-row"><span>${u.email}</span><span class="muted">${u.watchlistCount} watched &middot; ${u.favoritesCount} favorites</span></div>`).join('')
    : '<div class="empty">No accounts yet.</div>';

  const artistsHtml = data.topFavoriteArtists.length
    ? data.topFavoriteArtists.map(a => `<span class="chip">${a.artist} (${a.count})</span>`).join('')
    : '<div class="empty">No favorite artists tracked yet.</div>';

  const suggestionsHtml = data.suggestions.list.length
    ? data.suggestions.list.map(s => `<div class="stat-row" style="display:block;"><div><strong>${s.venueName}</strong> <span class="muted">— ${s.submitterEmail} &middot; ${fmtDate(s.submittedAt)}</span></div>${s.notes ? `<div class="muted" style="margin-top:4px;">${s.notes}</div>` : ''}</div>`).join('')
    : '<div class="empty">No suggestions yet.</div>';

  el.innerHTML = `
    <div class="block"><h2>Subscribers (${data.subscribers.count})</h2>${subsHtml}</div>
    <div class="block"><h2>Accounts (${data.users.count})</h2>${usersHtml}</div>
    <div class="block"><h2>Top favorited artists</h2>${artistsHtml}</div>
    <div class="block"><h2>Venue suggestions (${data.suggestions.count})</h2>${suggestionsHtml}</div>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
    <p class="muted" style="font-size:11px;margin-top:16px;">Not tracked here yet: email opens/clicks (needs a separate Resend API integration) and site pageviews (no analytics currently installed).</p>
  `;
  document.getElementById('refresh-btn').addEventListener('click', loadStats);
}

async function loadStats(){
  if(!SESSION_TOKEN){ return; }
  const el = document.getElementById('content');
  try{
    const res = await fetch(`${WORKER_BASE_URL}/api/admin/stats`, {
      headers: { 'Authorization': `Bearer ${SESSION_TOKEN}` }
    });
    const data = await res.json();
    if(data.error){
      el.innerHTML = `<div class="error">${data.error}${data.error === 'Not authorized' ? ' — this page only works for the site owner account.' : ''}</div>`;
      return;
    }
    renderStats(data);
  }catch(e){
    el.innerHTML = '<div class="error">Failed to load stats. Try refreshing.</div>';
  }
}

(function init(){
  const params = new URLSearchParams(window.location.search);
  const incomingSession = params.get('session');
  if(incomingSession){
    SESSION_TOKEN = incomingSession;
    localStorage.setItem('sessionToken', SESSION_TOKEN);
    window.history.replaceState({}, '', window.location.pathname);
  }
  if(SESSION_TOKEN){
    loadStats();
  } else {
    document.getElementById('admin-signin-btn').addEventListener('click', beginSignIn);
  }
})();
</script>
</body>
</html>
